[build-system]                                                             
requires = ["hatchling"]                                                   
build-backend = "hatchling.build"                                          

[project]
name = "mentor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "conduit",
    "kramer",
    "levenshtein>=0.27.1",
    "motor>=3.7.1",
    "pandas>=2.3.2",
    "pillow>=11.3.0",
    "psycopg2-binary>=2.9.10",
    "pymongo>=4.15.1",
    "rapidfuzz>=3.14.1",
    "rich>=14.1.0",
    "siphonserver",
]

# ── Hatchling (build) ──────────────────────────────────────────────────────────
# Point Hatchling at the src/ package; this is the critical bit for src-layout.
[tool.hatch.build.targets.wheel]
packages = ["src/mentor"]
sources = ["src"]
include = ["src/mentor/py.typed"]

# -- Torch Dependency Management -----------------------------------------------
[project.optional-dependencies]
ml-server = ["torch==2.9.0+cu128"]
default = ["torch==2.9.0"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# ── uv sources (local/editable deps) ───────────────────────────────────────────
# Also include torch from the custom index above
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
kramer = { path = "../kramer-project", editable = true }
conduit = { path = "../conduit-project", editable = true }
siphonserver = { path = "../siphonserver-project", editable = true }

[project.scripts]
mentor = "mentor.scripts.mentor_cli:main"
curate = "mentor.scripts.curate_cli:main"
